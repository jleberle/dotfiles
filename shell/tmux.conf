# -----------------------------
# General
# -----------------------------

set -g default-terminal "tmux-256color"

set -sg escape-time 0
set -g focus-events on

set -g history-limit 100000

# Faster pane switching
set -s repeat-time 300

# -----------------------------
# Prefix
# -----------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------
# Splits
# -----------------------------

bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

unbind '"'
unbind %

# -----------------------------
# Vim Navigation
# -----------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes quickly
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------
# Mouse
# -----------------------------

set -g mouse on

# -----------------------------
# Copy Mode (vim style)
# -----------------------------

setw -g mode-keys vi

# Sync tmux's copy buffer with the macOS system clipboard
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# -----------------------------
# Easier Reload
# -----------------------------

bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# -----------------------------
# Pane & Window Indexing
# -----------------------------

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

# -----------------------------
# Status Bar
# -----------------------------

# Appearance (colors, status-left/right, window formats, pane borders) is owned
# by the nord-tmux plugin loaded below. tpm runs last and overrides any
# manual styling, so only structural prefs live here.
set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# -----------------------------
# Better Window Switching
# -----------------------------

bind Tab last-window

bind -n M-h previous-window
bind -n M-l next-window

# -----------------------------
# Open new windows in cwd
# -----------------------------

bind c new-window -c "#{pane_current_path}"

# -----------------------------
# Performance
# -----------------------------

set -g assume-paste-time 0

# Status bar only shows minutes, so a slower refresh is plenty
set -g status-interval 5

# -----------------------------
# Terminal features
# -----------------------------

# Declare capabilities using terminal-features (tmux 3.2+), which supersedes
# terminal-overrides for RGB, undercurl, and cursor-shape passthrough.
# RGB:       true-color support (replaces the old Tc override)
# usstyle:   colored underlines (error/warn squiggles in nvim diagnostics)
# cstyle:    cursor-shape passthrough (block in normal, beam in insert)
set -as terminal-features '*:RGB:usstyle:cstyle'

#------------------------------
# Plugins
# -----------------------------

set -g @plugin 'tmux-plugins/tpm'
# Nord moved from arcticicestudio/nord-tmux to the nordtheme org.
set -g @plugin 'nordtheme/tmux'

run '~/.tmux/plugins/tpm/tpm'
