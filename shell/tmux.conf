# -----------------------------
# General
# -----------------------------

set -g default-terminal "tmux-256color"

set -sg escape-time 0
set -g focus-events on

set -g history-limit 100000

# Faster pane switching
set -s repeat-time 300

# -----------------------------
# Prefix
# -----------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------
# Splits
# -----------------------------

bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

unbind '"'
unbind %

# -----------------------------
# Vim Navigation
# -----------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes quickly
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------
# Mouse
# -----------------------------

set -g mouse on

# -----------------------------
# Copy Mode (vim style)
# -----------------------------

setw -g mode-keys vi

# Sync tmux's copy buffer with the macOS system clipboard
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# -----------------------------
# Easier Reload
# -----------------------------

bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# -----------------------------
# Pane & Window Indexing
# -----------------------------

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

# -----------------------------
# Status Bar
# -----------------------------

set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# -----------------------------
# Better Window Switching
# -----------------------------

bind Tab last-window

bind -n M-h previous-window
bind -n M-l next-window

# -----------------------------
# Open new windows in cwd
# -----------------------------

bind c new-window -c "#{pane_current_path}"

# -----------------------------
# Performance
# -----------------------------

set -g assume-paste-time 0

# Status bar only shows minutes, so a slower refresh is plenty
set -g status-interval 5

# -----------------------------
# Terminal features
# -----------------------------

# Declare capabilities using terminal-features (tmux 3.2+), which supersedes
# terminal-overrides for RGB, undercurl, and cursor-shape passthrough.
# RGB:       true-color support (replaces the old Tc override)
# usstyle:   colored underlines (error/warn squiggles in nvim diagnostics)
# cstyle:    cursor-shape passthrough (block in normal, beam in insert)
set -as terminal-features '*:RGB:usstyle:cstyle'

#------------------------------
# Theme (Nord)
# -----------------------------

# Vendored from nord-tmux 0.3.0 (arcticicestudio/nord-tmux, MIT); upstream is
# archived. It was only the ~20 `set` lines below sitting behind a plugin
# manager, so TPM existed solely to fetch them. Inlining removes an unpinned
# `git clone` from `make shell`, a plugin-update step from `make update`, and a
# dependency on GitHub being reachable when tmux starts.
#
# Colors are the terminal's own 16-color palette rather than hex literals, so
# they follow whatever Nord palette Ghostty is running (shell/ghostty/config).
#
# Two upstream settings are deliberately not copied: `status-interval 1` (the
# status bar's finest unit is minutes, so the 5s set above is plenty) and the
# `@prefix_highlight_*` options -- that plugin was never installed here, so its
# `#{prefix_highlight}` placeholder is dropped from status-right as well.

#+--- Status bar ---+
set -g status on
set -g status-style bg=black,fg=white

#+--- Panes ---+
set -g pane-border-style bg=default,fg=brightblack
set -g pane-active-border-style bg=default,fg=blue
set -g display-panes-colour black
set -g display-panes-active-colour brightblack

#+--- Clock mode ---+
setw -g clock-mode-colour cyan

#+--- Messages ---+
set -g message-style bg=brightblack,fg=cyan
set -g message-command-style bg=brightblack,fg=cyan

#+--- Status content ---+
# Separators are Powerline glyphs (U+E0B0-E0B3), supplied by the JetBrainsMono
# Nerd Font that shell/ghostty/config sets.
set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=blue,bg=black,nobold,noitalics,nounderscore]"
set -g status-right "#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] %Y-%m-%d #[fg=white,bg=brightblack,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] %I:%M %p #[fg=cyan,bg=brightblack,nobold,noitalics,nounderscore]#[fg=black,bg=cyan,bold] #H "
set -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#W #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
