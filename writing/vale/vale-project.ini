# Per-project Vale config — copied to ./.vale.ini by the `valeinit` fish
# function. Overrides the global ~/.vale.ini for files under this directory.

StylesPath = .vale/styles

MinAlertLevel = suggestion

# Opt-in packages — uncomment what fits the project, then run `vale sync`
# (downloads into the local .vale/styles) and add to BasedOnStyles below:
#   proselint    high-precision style lint (the global default)
#   Readability  grade-level metrics — for syllabi / public-facing writing
#   alex         insensitive-language check — expect false positives on
#                period terminology and primary-source quotations
#   write-good   noisy; largely redundant with proselint
# Packages = proselint, Readability

[*.md]
BasedOnStyles = Vale

# Spelling is owned by vim's built-in spell; grammar by harper_ls.
Vale.Spelling = NO
