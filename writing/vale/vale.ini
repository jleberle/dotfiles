# Global Vale config — installed to ~/.vale.ini by `make vale`, which fills in
# the absolute home path (Vale does not expand ~ or env vars in StylesPath).
#
# This is the fallback used by nvim-lint when a markdown file has no
# project-local .vale.ini up its directory tree. `make vale` runs `vale sync`
# to download the external Packages listed below.

StylesPath = __HOME__/.local/share/vale/styles

MinAlertLevel = suggestion

# All four packages stay synced so per-project configs can opt in (see
# vale-project.ini), but only the high-precision one runs globally.
Packages = proselint, write-good, Readability, alex

[*.{md,markdown,txt}]
# Lean baseline for scholarly prose. Tested on a typical history paragraph:
# proselint was the only package whose alerts were actionable. The others are
# per-project opt-ins — write-good (E-Prime forbids all forms of "to be";
# passive-voice flags legitimate historical narration), Readability (grade 8-10
# caps that all academic prose exceeds), alex (flags period terminology and
# primary-source quotations, e.g. "master" in slavery scholarship).
BasedOnStyles = Vale, proselint

# vim's built-in spell owns spelling (and harper_ls owns grammar) — avoid
# double-flagging every misspelling.
Vale.Spelling = NO
