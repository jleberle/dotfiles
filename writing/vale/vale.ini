# Global Vale config — installed to ~/.vale.ini by `make vale`, which fills in
# the absolute home path (Vale does not expand ~ or env vars in StylesPath).
#
# This is the fallback used by nvim-lint when a markdown file has no
# project-local .vale.ini up its directory tree. `make vale` runs `vale sync`
# to download the external Packages listed below.

StylesPath = __HOME__/.local/share/vale/styles

MinAlertLevel = suggestion

Packages = proselint, write-good, Readability, alex

[*.{md,markdown,txt}]
BasedOnStyles = Vale, proselint, write-good, Readability, alex
