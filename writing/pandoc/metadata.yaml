title: "Research Paper"
author: "Jared Eberle"
date: 2026-05-28

bibliography:
  # CSL JSON (not .bib): preserves Zotero's archive / archive-location fields,
  # which the BibTeX export drops. Better BibTeX keeps both auto-exported.
  # The telescope-bibtex / cite.fish citekey pickers still read the .bib.
  - ~/Documents/Library/Library.json

# CMOS 18th edition (current); swap to ...-17th-edition.csl for journals
# still on 17e. Keep this default in sync with the newdoc fish function.
csl: ~/git/dotfiles/writing/pandoc/chicago-notes-bibliography-18th-edition.csl

link-citations: true

reference-doc: ~/git/dotfiles/writing/pandoc/reference.docx

geometry: margin=1in

fontsize: 12pt

linestretch: 1.5
