when:
  - event: push
    branch: main
  - event: pull_request
    branch: main

# Image pinned by digest (not just the `bookworm` tag) so a Debian mirror
# update can't silently change what this pipeline runs against. Re-pin with:
#   crane digest debian:bookworm

steps:
  - name: shellcheck
    image: debian@sha256:49ba348354a28e39c70beffd6cf43bdb8d55d81ce4b746b0428717d054b8bbc4
    pull: true
    commands:
      - apt-get update -o Acquire::Retries=3
      - env DEBIAN_FRONTEND=noninteractive apt-get install -y make shellcheck
      - make lint-shellcheck

  - name: fish-syntax
    image: debian@sha256:49ba348354a28e39c70beffd6cf43bdb8d55d81ce4b746b0428717d054b8bbc4
    pull: true
    commands:
      - apt-get update -o Acquire::Retries=3
      - env DEBIAN_FRONTEND=noninteractive apt-get install -y make fish
      - make lint-fish

  - name: luacheck
    image: debian@sha256:49ba348354a28e39c70beffd6cf43bdb8d55d81ce4b746b0428717d054b8bbc4
    pull: true
    commands:
      - apt-get update -o Acquire::Retries=3
      - env DEBIAN_FRONTEND=noninteractive apt-get install -y make lua5.4 luarocks
      - luarocks install luacheck 1.2.0
      - make lint-luacheck

  - name: writing-check
    image: debian@sha256:49ba348354a28e39c70beffd6cf43bdb8d55d81ce4b746b0428717d054b8bbc4
    pull: true
    commands:
      - apt-get update -o Acquire::Retries=3
      - env DEBIAN_FRONTEND=noninteractive apt-get install -y make fish python3
      - make writing-check

  # Fail-closed secret scan backstop: the local `git/hooks/pre-commit` gitleaks
  # check fails *open* if gitleaks isn't installed on the dev's machine, so CI
  # is the only place a missing secret scan is guaranteed to be caught.
  - name: secrets
    image: debian@sha256:49ba348354a28e39c70beffd6cf43bdb8d55d81ce4b746b0428717d054b8bbc4
    pull: true
    commands:
      - apt-get update -o Acquire::Retries=3
      - env DEBIAN_FRONTEND=noninteractive apt-get install -y make curl
      - curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      - echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
      - tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - mv gitleaks /usr/local/bin/gitleaks
      - make lint-secrets
