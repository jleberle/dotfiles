# Hosted CI on Codeberg now runs via `.woodpecker/lint.yaml`.
# Kept as a compatible Actions workflow for GitHub or future Forgejo runners.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish lua5.4 luarocks && sudo luarocks install luacheck

      - name: Run repo lint target
        run: make lint
