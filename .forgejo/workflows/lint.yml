# Codeberg does not currently provide shared runners so this workflow will not
# run automatically. Kept as a placeholder for if/when runners are configured.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y shellcheck fish lua5.4 luarocks && sudo luarocks install luacheck

      - name: shellcheck (bin scripts)
        run: |
          shellcheck bin/homebrewupdate.sh
          shellcheck bin/homebrewlogclean.sh

      - name: fish syntax check
        run: |
          for f in fish/config.fish fish/conf.d/*.fish fish/functions/*.fish; do
            fish --no-execute "$f" || exit 1
          done

      - name: luacheck (nvim lua)
        run: luacheck nvim/lua/ --globals vim --no-unused-args
