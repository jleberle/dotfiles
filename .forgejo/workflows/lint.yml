# Codeberg does not currently provide shared runners so this workflow will not
# run automatically. Kept as a placeholder for if/when runners are configured.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish lua5.4 luarocks && sudo luarocks install luacheck

      - name: Run repo lint target
        run: make lint
