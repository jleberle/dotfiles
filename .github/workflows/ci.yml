name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 14 1 * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-checks:
    name: Linux checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            make \
            shellcheck \
            fish \
            python3 \
            curl \
            lua5.4 \
            luarocks
          sudo luarocks install luacheck 1.2.0

      - name: Shellcheck
        run: make lint-shellcheck

      - name: Fish syntax
        run: make lint-fish

      - name: Luacheck
        run: make lint-luacheck

      - name: Writing workflow checks
        run: make writing-check

      - name: Install gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan
        run: make lint-secrets

  macos-checks:
    name: macOS-native checks
    runs-on: macos-14

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install macOS dependencies
        run: brew install fish neovim

      - name: plist / workflow lint
        run: make lint-plists

      - name: Writing workflow checks
        run: make writing-check

      - name: Headless Neovim smoke test
        run: make nvim-check

  scheduled-failure-issue:
    name: Report scheduled CI failure
    runs-on: ubuntu-24.04
    needs: [linux-checks, macos-checks]
    if: ${{ github.event_name == 'schedule' && always() && (needs.linux-checks.result != 'success' || needs.macos-checks.result != 'success') }}

    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        env:
          LINUX_RESULT: ${{ needs.linux-checks.result }}
          MACOS_RESULT: ${{ needs.macos-checks.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Scheduled CI failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'The monthly scheduled CI run failed.',
              '',
              `- Run: ${runUrl}`,
              `- Linux checks: ${process.env.LINUX_RESULT}`,
              `- macOS-native checks: ${process.env.MACOS_RESULT}`,
              '',
              'This issue is managed by GitHub Actions and will be updated on later failures.',
            ].join('\n');

            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const wantedLabels = labels
              .map((label) => label.name)
              .filter((name) => name === 'ci');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Another scheduled CI run failed: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: wantedLabels,
              });
            }

  scheduled-failure-close:
    name: Close scheduled CI failure issue on recovery
    runs-on: ubuntu-24.04
    needs: [linux-checks, macos-checks]
    if: ${{ github.event_name == 'schedule' && needs.linux-checks.result == 'success' && needs.macos-checks.result == 'success' }}

    permissions:
      contents: read
      issues: write

    steps:
      - name: Close standing failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Scheduled CI failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Scheduled CI recovered in ${runUrl}; closing this issue.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
