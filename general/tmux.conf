# -----------------------------
# General
# -----------------------------

set -g default-terminal "tmux-256color"

set -sg escape-time 0
set -g focus-events on

set -g history-limit 100000

# Faster pane switching
set -s repeat-time 300

# -----------------------------
# Prefix
# -----------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------
# Splits
# -----------------------------

bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

unbind '"'
unbind %

# -----------------------------
# Vim Navigation
# -----------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes quickly
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------
# Mouse
# -----------------------------

set -g mouse on

# -----------------------------
# Copy Mode (vim style)
# -----------------------------

setw -g mode-keys vi

# Sync tmux's copy buffer with the macOS system clipboard
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# -----------------------------
# Easier Reload
# -----------------------------

bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# -----------------------------
# Pane & Window Indexing
# -----------------------------

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

# -----------------------------
# Status Bar
# -----------------------------

# Appearance (colors, status-left/right, window formats, pane borders) is owned
# by the catppuccin/tmux plugin loaded below. tpm runs last and overrides any
# manual styling, so only structural prefs live here.
set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# -----------------------------
# Better Window Switching
# -----------------------------

bind Tab last-window

bind -n M-h previous-window
bind -n M-l next-window

# -----------------------------
# Open new windows in cwd
# -----------------------------

bind c new-window -c "#{pane_current_path}"

# -----------------------------
# Performance
# -----------------------------

set -g assume-paste-time 0

# Status bar only shows minutes, so a slower refresh is plenty
set -g status-interval 5

# -----------------------------
# True Color
# -----------------------------

set-option -sa terminal-features ',xterm-256color:RGB'

# -----------------------------
# Neovim / LazyVim rendering
# -----------------------------

# Pass undercurls through tmux (LazyVim uses them for diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Pass colored underlines through (error=red, warn=yellow squiggles, etc.)
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass cursor-shape changes through so nvim's mode cursor (block in normal,
# beam in insert) works inside tmux
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

#------------------------------
# Plugins
# -----------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# Match nvim (catppuccin-mocha), ghostty, and bat
set -g @catppuccin_flavour 'mocha'

run '~/.tmux/plugins/tpm/tpm'
