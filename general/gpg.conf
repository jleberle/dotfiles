# Use modern algorithms
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed

# Strong defaults
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed

# Prefer strong algorithms
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256

# Disable weak algorithms
weak-digest SHA1

# Harden passphrase derivation
s2k-mode 3
s2k-count 10485760

# Better key verification — always show full fingerprint.
# keyid-format is deprecated in GnuPG 2.5+; fingerprint display is the
# modern equivalent and unambiguous.
with-fingerprint
verify-options show-uid-validity
list-options show-uid-validity show-unusable-uids

# Safer behavior
require-cross-certification
no-symkey-cache

# Privacy improvements
no-emit-version
no-comments

# Use modern keyserver behavior
auto-key-locate local,wkd,keyserver
keyserver-options no-honor-keyserver-url,no-auto-key-retrieve,include-revoked,include-subkeys

# UTF-8 support for compatibility
charset utf-8
utf8-strings

# Show Unix timestamps
fixed-list-mode

# Enable smartcard
use-agent

# Default key for encryption, signing, and git commit signing (gpg.format=openpgp).
default-key 0xE0646B558C79DB58
sig-keyserver-url https://jaredeberle.org/key.asc
